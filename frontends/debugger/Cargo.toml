[package]
name = "debugger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sly-debugger"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
http_client = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
settings = { path = "../../crates/settings" }
game-database = { path = "../../crates/game-database" }
core-loader = { path = "../../crates/core-loader", features = ["debug"] }
gpui = { workspace = true }
artwork = { path = "../../crates/artwork" }
cirsium = { path = "../../crates/cirsium" }
core-model = { path = "../../crates/models/core" }
debugger-model = { path = "../../crates/models/debugger" }
workspace-model = { path = "../../crates/models/workspace" }
scripting = { path = "../../crates/scripting" }
storage = { path = "../../crates/storage" }
audio = { path = "../../crates/audio" }
futures = "0.3.31"
tracing.workspace = true
tracing-subscriber.workspace = true
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
reqwest_client = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { workspace = true }
gpui_web = { workspace = true }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestRedirect",
    "Headers",
    "Response",
    "Document",
    "EventTarget",
    "Event",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "Blob",
    "Url",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
] }
