[package]
name = "gba"
version = "0.1.0"
edition = "2024"

[features]
default = ["disasm"]
disasm = []
debug = ["dep:debugger-model", "dep:workspace-model"]

[dependencies]
chapa = { version = "0.11.0", features = ["reflection"] }
chipi-macros = "1.1.0"
core-model = { path = "../../models/core" }
workspace-model = { path = "../../models/workspace", optional = true }
debugger-model = { path = "../../models/debugger", optional = true }
crc32fast = "1.5.0"
sha1 = "0.11.0"
thiserror = "2.0.18"
tracing = { workspace = true }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
