[package]
name = "snes"
version = "0.1.0"
edition = "2024"

[features]
default = ["disasm"]
disasm = []
debug = ["dep:debugger-model", "dep:workspace-model"]

[dependencies]
chapa = { version = "0.11.0", features = ["reflection"] }
core-model = { path = "../../models/core" }
debugger-model = { path = "../../models/debugger", optional = true }
workspace-model = { path = "../../models/workspace", optional = true }
chipi-macros = "1.1.0"
inventory = "0.3.24"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"
crc32fast = "1.5.0"
sha1 = "0.11.0"
thiserror = "2.0.18"
tracing.workspace = true
